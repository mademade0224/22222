<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTOME GAME</title>
  <link rel="stylesheet" href="style.css">
  <script src="story.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main id="game">
    <div id="scene">
      <img id="background" src="images/background.jpg" alt="背景">
      <div id="bg-fade"></div>
      <img id="character" src="" alt="キャラクター" class="is-hidden" style="display: none;">

      <section id="message-box">
        <div id="name">？？？</div>
        <p id="text">ゲームを読み込んでいます...</p>

        <div id="name-input-screen">
        <div class="name-input-box">
          <p class="name-input-title">あなたの名前を教えてください</p>
          <input id="player-name-input" type="text" placeholder="例：あおい（未入力ならYOU）" maxlength="10">
          <button id="start-game-button" type="button">ゲームを始める</button>
        </div>
      </div>

        <div id="choices"></div>

        <button id="next-button" type="button">次へ ▼</button>
      </section>
    </div>
  </main>
</body>
</html>
