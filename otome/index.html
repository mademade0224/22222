<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTOME GAME</title>
  <link rel="stylesheet" href="style.css">
  <script src="story.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main id="game">
    <div id="scene">
      <img id="background" src="images/background.jpg" alt="背景">
      <div id="bg-fade"></div>
      <img id="character" src="" alt="キャラクター" class="is-hidden" style="display: none;">

      <section id="message-box">
        <div id="name"></div>
        <div id="text"></div>
        <div id="typing-area" style="display: none;">
          <div id="typing-target"></div>
          <input id="typing-input" type="text" autocomplete="off" placeholder="ここに入力してEnter">
          <div id="typing-status"></div>
        </div>
        <div id="choices"></div>
        <button id="next-button" type="button">次へ ▼</button>
      </section>

      <!-- 右上の操作方法ボタン -->
      <button id="help-button" type="button" aria-label="操作方法">？</button>

      <!-- 操作方法モーダル -->
      <div id="help-modal" class="is-hidden">
        <div class="help-modal-box">
          <h2 class="help-modal-title">操作方法</h2>
          <p class="help-modal-text">enterまたはbuttonで次へ</p>
          <button id="close-help-button" type="button">閉じる</button>
        </div>
      </div>

      <!-- 名前入力画面 -->
      <div id="name-input-screen">
        <div class="name-input-box">
          <p class="name-input-title">あなたの名前を教えてください</p>
          <input id="player-name-input" type="text" placeholder="your name" maxlength="10">
          <button id="start-game-button" type="button">けってい</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
