
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>逃げるゲーム</title>

<style>
body {
    margin: 0;
    background: #fff;
    overflow: hidden;
}

/* タイトル画面 */
#titleScreen {
    position: fixed;
    inset: 0;
}

/* タイトル画像 */
.title {
    position: absolute;
    width: 400px;
    top: 30%;
    opacity: 0;
}

.title1 {
    left: 50%;
    transform: translate(-150vw, -50%);
    animation: slide1 1s ease-out forwards;
}

.title2 {
    left: 50%;
    transform: translate(150vw, -50%);
    animation: slide2 1s ease-out 1s forwards;
}

@keyframes slide1 {
    to {
        transform: translate(-100%, -50%);
        opacity: 1;
    }
}

@keyframes slide2 {
    to {
        transform: translate(0, -50%);
        opacity: 1;
    }
}

/* STARTボタン */
#start {
        z-index: 10;
    pointer-events: auto;
    position: absolute;
    top: 70%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: fadeIn 1.5s ease 2.2s forwards;
    padding: 15px 60px;
    font-size: 25px;
    cursor: pointer;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* ゲーム画面 */
#gameScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #fff;
}

/* 逃げる画像 */
#escapeImage {
    position: absolute;
    width: 150px;
    cursor: pointer;
    transition: left 0.15s, top 0.15s;
}
    #dialogue {
    display: none;

    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);

    background: white;
    color: black;
    padding: 20px 40px;
    border: 3px solid black;
    border-radius: 15px;

    font-size: 20px;
    min-width: 200px;
    text-align: center;
}

    #fade {
  position: fixed;
  inset: 0;
  background: black;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s ease;
  z-index: 9999;
}

#fade.active {
  opacity: 1;
}
</style>
</head>

<body>

<!-- タイトル画面 -->
<div id="titleScreen">
    <img src="images/title1.png" class="title title1">
    <img src="images/title2.png" class="title title2">
    <button id="start">START</button>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen">
    <img src="images/image.png" id="escapeImage">
        <div id="dialogue">
        こんにちは！
    </div>
</div>

<script>

// STARTボタン
document.getElementById("start").addEventListener("click", function() {

    // タイトル画面を消す
    document.getElementById("titleScreen").style.display = "none";

    // ゲーム画面を表示
    document.getElementById("gameScreen").style.display = "block";

        img.style.left = "100px";
    img.style.top = "100px";

});


// 画像
const img = document.getElementById("escapeImage");

// STARTボタン
document.getElementById("start").addEventListener("click", function() {

    document.getElementById("titleScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";

    // 初期位置
    img.style.left = "100px";
    img.style.top = "100px";

});


// 逃走処理
function escape() {

    const maxX = window.innerWidth - img.offsetWidth;
    const maxY = window.innerHeight - img.offsetHeight;

    const x = Math.random() * Math.max(0, maxX);
    const y = Math.random() * Math.max(0, maxY);

    img.style.left = x + "px";
    img.style.top = y + "px";

}

// マウスが触れたら逃げる
img.addEventListener("mouseenter", escape);


// セリフ一覧
const dialogues = [
    "発挑考…見調振♡",
    "殻を…破っちゃうぞ♡",
    "最近遅刻が多いんじゃない？",
    "規律ある自由…感じて？"
];

let gamestarted = false;
    
// クリックしたらセリフ表示
img.addEventListener("click", function() {

let gameStarted = false;

img.addEventListener("click", function() {
  const random = Math.floor(Math.random() * dialogues.length);
  const dialogue = document.getElementById("dialogue");

  dialogue.textContent = dialogues[random];
  dialogue.style.display = "block";

  if (!gameStarted) {
    gameStarted = true;

    // 2秒後に暗転開始
    setTimeout(function() {
      document.getElementById("fade").classList.add("active");

      // 暗転完了後に乙女ゲームへ移動
      setTimeout(function() {
        window.location.href = "otome/index.html";
      }, 1500);

    }, 2000);
  }
});


</script>
<div id="fade"></div>
</body>
</html>
