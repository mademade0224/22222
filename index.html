
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>逃げるゲーム</title>

<style>
body {
    margin: 0;
    background: #111;
    overflow: hidden;
}

/* タイトル画面 */
#titleScreen {
    position: fixed;
    inset: 0;
}

/* タイトル画像 */
.title {
    position: absolute;
    width: 400px;
    top: 30%;
    opacity: 0;
}

.title1 {
    left: 50%;
    transform: translate(-150vw, -50%);
    animation: slide1 1s ease-out forwards;
}

.title2 {
    left: 50%;
    transform: translate(150vw, -50%);
    animation: slide2 1s ease-out 1s forwards;
}

@keyframes slide1 {
    to {
        transform: translate(-100%, -50%);
        opacity: 1;
    }
}

@keyframes slide2 {
    to {
        transform: translate(0, -50%);
        opacity: 1;
    }
}

/* STARTボタン */
#start {
    position: absolute;
    top: 70%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: fadeIn 1.5s ease 2.2s forwards;
    padding: 15px 60px;
    font-size: 25px;
    cursor: pointer;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* ゲーム画面 */
#gameScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: #222;
}

/* 逃げる画像 */
#escapeImage {
    position: absolute;
    width: 150px;
    cursor: pointer;
    transition: left 0.15s, top 0.15s;
}
</style>
</head>

<body>

<!-- タイトル画面 -->
<div id="titleScreen">
    <img src="images/title1.png" class="title title1">
    <img src="images/title2.png" class="title title2">
    <button id="start">START</button>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen">
    <img src="images/image.png" id="escapeImage">
</div>

<script>

// STARTボタン
document.getElementById("start").addEventListener("click", function() {

    // タイトル画面を消す
    document.getElementById("titleScreen").style.display = "none";

    // ゲーム画面を表示
    document.getElementById("gameScreen").style.display = "block";

});

// 画像が逃げる処理
const img = document.getElementById("escapeImage");

function escape() {

    const maxX = window.innerWidth - img.offsetWidth;
    const maxY = window.innerHeight - img.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    img.style.left = x + "px";
    img.style.top = y + "px";
}

img.addEventListener("mouseenter", escape);

</script>

</body>
</html>
